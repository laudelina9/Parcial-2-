<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciber-Detective Escolar</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #090d16; color: #38bdf8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .terminal { background: #0f172a; border: 2px solid #0284c7; border-radius: 12px; width: 100%; max-width: 650px; padding: 25px; box-shadow: 0 0 25px rgba(2,132,199,0.25); border-top: 30px solid #1e293b; position: relative; }
        .terminal::before { content: "● ● ●"; position: absolute; top: -22px; left: 15px; color: #64748b; font-size: 12px; }
        .header { border-bottom: 1px solid #334155; padding-bottom: 12px; margin-bottom: 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; color: #f8fafc; }
        .story { font-size: 1.1rem; line-height: 1.6; color: #cbd5e1; min-height: 120px; }
        .choices { margin-top: 25px; }
        .choice-btn { display: block; width: 100%; background: transparent; border: 1px solid #0284c7; color: #38bdf8; padding: 14px; margin: 12px 0; text-align: left; cursor: pointer; font-size: 1rem; border-radius: 6px; transition: all 0.2s; box-shadow: inset 0 0 0 0 rgba(2,132,199,0.2); }
        .choice-btn:hover { background: rgba(56,189,248,0.1); padding-left: 22px; border-color: #38bdf8; box-shadow: inset 5px 0 0 0 #38bdf8; }
        .score-bar { background: #1e293b; border-radius: 20px; height: 10px; margin-top: 5px; overflow: hidden; border: 1px solid #334155; }
        .score-fill { background: #ef4444; width: 0%; height: 100%; transition: width 0.5s ease; }
        .illustration-box { display: flex; justify-content: center; margin: 15px 0; padding: 15px; background: #090d16; border-radius: 8px; border: 1px dashed #334155; }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="header">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            SISTEMA DE INVESTIGACIÓN FORENSE DIGITAL v2.0
        </div>
        
        <div style="margin-bottom: 20px;">
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 0.9rem;">
                <span>⚠️ NIVEL DE AMENAZA EN LA RED:</span>
                <span id="risk-text" style="color:#ef4444;">0%</span>
            </div>
            <div class="score-bar"><div class="score-fill" id="risk-fill"></div></div>
        </div>

        <div class="illustration-box" id="graphic-zone">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 1 1-7.6-14 8.38 8.38 0 0 1 3.8.9M21 21l-4.35-4.35"/></svg>
        </div>

        <div class="story" id="story-text">Cargando caso criminal...</div>
        <div class="choices" id="choices-box"></div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'click') {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05); osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'danger') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(180, audioCtx.currentTime); osc.frequency.setValueAtTime(120, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'victory') {
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination); o.frequency.setValueAtTime(freq, audioCtx.currentTime + (i * 0.08));
                    g.gain.setValueAtTime(0.08, audioCtx.currentTime + (i * 0.08)); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (i * 0.08) + 0.4);
                    o.start(audioCtx.currentTime + (i * 0.08)); o.stop(audioCtx.currentTime + (i * 0.08) + 0.4);
                });
            }
        }

        let risk = 0;
        
        // SVGs incrustados dinámicos según la pista
        const imgs = {
            search: `<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
            mail: `<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,
            wifi: `<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#eab308" stroke-width="1.5"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20" stroke-width="3"/></svg>`,
            secure: `<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`
        };

        const nodes = {
            start: {
                text: "El director te convoca de urgencia: 'Alguien vulneró el Instagram institucional y publicó comunicados falsos'. En el historial web de la cuenta detectás accesos sospechosos ayer por la tarde. ¿Por dónde abrimos la línea de investigación técnica?",
                img: 'search',
                choices: [
                    { text: "Auditar los correos electrónicos del gestor de redes en la PC institucional.", target: "mail_check" },
                    { text: "Rastrear la ubicación geográfica. Se conectó desde el Wi-Fi abierto de la plaza local.", target: "wifi_check" }
                ]
            },
            mail_check: {
                text: "Analizando la bandeja de entrada, salta una alerta fraudulenta de 'admin@1nstagram-security-verif.com' que solicita 'Actualizar credenciales de inmediato'. El encargado reconoce que ingresó al link e ingresó la clave actual. ¿Ante qué ataque estamos?",
                img: 'mail',
                choices: [
                    { text: "Ingeniería Social / Phishing (Suplantación de identidad para robo de datos).", target: "phishing_correct" },
                    { text: "Infección directa por virus de hardware en la placa base.", target: "virus_wrong" }
                ]
            },
            wifi_check: {
                text: "Confirmado: Se autenticó en 'Wi-Fi_Publico_Gratis' sin contraseña. Un atacante cercano capturó todo el tráfico de datos del aire mediante técnicas de escucha (Man-in-the-Middle) porque no había cifrado. Esto ocurrió porque:",
                img: 'wifi',
                choices: [
                    { text: "Los datos viajaron planos (sin cifrado) por no usar túneles VPN ni seguridad local.", target: "wifi_correct" },
                    { text: "La antena del dispositivo móvil sufrió una sobrecarga térmica.", target: "wifi_wrong" }
                ]
            },
            phishing_correct: {
                text: "¡Correcto! Clonaron perfectamente el diseño web oficial para que la víctima entregue el password de forma voluntaria. Para recuperar el control absoluto y evitar futuros robos, ¿cuál es el protocolo?",
                img: 'secure',
                choices: [
                    { text: "Modificar clave a una robusta y desplegar el Doble Factor de Autenticación (2FA).", target: "win" },
                    { text: "Instalar un optimizador del sistema y resetear el navegador web.", target: "half_win" }
                ]
            },
            virus_wrong: {
                text: "Los virus físicos no manipulan casillas de correo externas de esa forma. El atacante utilizó engaño visual. La vulnerabilidad de la red escolar asciende.",
                img: 'mail', next: "mail_check", addRisk: 25
            },
            wifi_correct: {
                text: "¡Excelente deducción forense! En redes abiertas, cualquiera con un software básico puede leer los paquetes del aire. ¿Cómo blindamos los dispositivos del colegio a partir de ahora?",
                img: 'secure',
                choices: [
                    { text: "Prohibir conexiones desprotegidas y obligar al uso de canales con protección 2FA.", target: "win" },
                    { text: "Vaciar las cookies y la memoria caché al terminar de postear.", target: "half_win" }
                ]
            },
            wifi_wrong: {
                text: "Explicación errónea. La temperatura no influye en los protocolos de cifrado de paquetes inalámbricos. El nivel de riesgo escala.",
                img: 'wifi', next: "wifi_check", addRisk: 25
            },
            win: {
                text: "🏆 ¡Caso Resuelto con Honores! Activaste la verificación en dos pasos (2FA). Aunque un hacker adivine la clave, el sistema bloqueará el acceso sin el token del celular. ¡Héroe de la ciberseguridad!",
                img: 'secure', choices: [{ text: "Iniciar nueva auditoría digital", target: "start_reset" }]
            },
            half_win: {
                text: "Solución parcial. Cambiaste el software pero el canal de autenticación sigue desprotegido. Sin el doble factor (2FA) la cuenta será vulnerable ante cualquier descuido. ¡Mitigación insuficiente!",
                img: 'search', choices: [{ text: "Revisar los protocolos de seguridad", target: "start_reset" }]
            }
        };

        function goToNode(nodeKey) {
            if (nodeKey === "start_reset") { risk = 0; nodeKey = "start"; }
            const node = nodes[nodeKey];
            
            if (node.addRisk) { risk += node.addRisk; playSound('danger'); }
            else if (nodeKey === 'win') { playSound('victory'); }
            else { playSound('click'); }
            
            document.getElementById("risk-text").innerText = risk + "%";
            document.getElementById("risk-fill").style.width = risk + "%";
            document.getElementById("graphic-zone").innerHTML = imgs[node.img] || imgs['search'];
            document.getElementById("story-text").innerText = node.text;
            
            const box = document.getElementById("choices-box");
            box.innerHTML = "";

            if (node.choices) {
                node.choices.forEach(c => {
                    const b = document.createElement("button"); b.className = "choice-btn";
                    b.innerText = c.text; b.onclick = () => goToNode(c.target);
                    box.appendChild(b);
                });
            } else if (node.next) {
                const b = document.createElement("button"); b.className = "choice-btn";
                b.innerText = "Reevaluar traza de datos..."; b.onclick = () => goToNode(node.next);
                box.appendChild(b);
            }
        }
        goToNode("start");
    </script>
</body>
</html>
